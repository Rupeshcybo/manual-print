<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Unpublished</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #000;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 40px;
    max-width: 480px;
  }

  /* Live orb logo */
  .orb {
    position: relative;
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8ecdff 0%, #3f8ff0 45%, #1c5cc4 100%);
    box-shadow:
      0 0 0 6px rgba(120, 140, 160, 0.08),
      0 0 26px 4px rgba(64, 140, 255, 0.35);
    animation: breathe 4.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 6px rgba(120,140,160,0.08), 0 0 26px 4px rgba(64,140,255,0.35); }
    50%      { transform: scale(1.035); box-shadow: 0 0 0 8px rgba(120,140,160,0.06), 0 0 36px 7px rgba(64,140,255,0.45); }
  }
  .eyes {
    position: absolute;
    top: 46%;
    left: 50%;
    display: flex;
    gap: 9px;
    transform: translate(-50%, -50%);
  }
  .eye {
    width: 7px;
    height: 15px;
    border-radius: 4px;
    background: #fff;
  }
  .eye.blink { animation: blink 0.18s ease; }
  @keyframes blink { 50% { transform: scaleY(0.15); } }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #111;
  }
  p {
    font-size: 15px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    background: #000;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.8; }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: #999;
  }
  .footer .fancy-link {
    display: block;
    margin-top: 8px;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 20px;
    color: #333;
    line-height: 1.4;
  }
  .footer .fancy-link a {
    color: #000;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .footer .fancy-link a:hover { opacity: 0.7; }
</style>
</head>
<body>
  <div class="container">
    <div class="orb" id="orb">
      <div class="eyes" id="eyes">
        <span class="eye" id="eyeL"></span>
        <span class="eye" id="eyeR"></span>
      </div>
    </div>

    <h1>This page isn't live</h1>

    <a href="/" class="btn">Go to Homepage</a>
    <div class="footer">
      <span class="fancy-link">Looking for the label tool? Try <a href="https://manualprint.vercel.app">manualprint.vercel.app</a></span>
    </div>
  </div>

<script>
  const orb = document.getElementById('orb');
  const eyes = document.getElementById('eyes');
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const MAX_SHIFT = 3.5; // px the eyes are allowed to drift

  function updateEyes(clientX, clientY) {
    const rect = orb.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const shift = Math.min(MAX_SHIFT, dist / 14);
    const x = (dx / dist) * shift;
    const y = (dy / dist) * shift;
    eyes.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  }

  window.addEventListener('mousemove', (e) => updateEyes(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) updateEyes(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  function scheduleBlink() {
    const delay = 2500 + Math.random() * 3000;
    setTimeout(() => {
      eyeL.classList.add('blink');
      eyeR.classList.add('blink');
      setTimeout(() => {
        eyeL.classList.remove('blink');
        eyeR.classList.remove('blink');
      }, 180);
      scheduleBlink();
    }, delay);
  }
  scheduleBlink();
</script>
</body>
</html>
