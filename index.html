<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Unpublished</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #000;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 40px;
    max-width: 480px;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #f4f4f5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg {
    width: 32px;
    height: 32px;
    stroke: #666;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #111;
  }
  p {
    font-size: 15px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    background: #000;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.8; }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="4.9" y1="4.9" x2="19.1" y2="19.1"></line>

    <a href="/" class="btn">Go to Homepage</a>
    <div class="footer">Looking for the label tool? Try <a href="https://manualprint.vercel.app" style="color:#666;text-decoration:underline;">manualprint.vercel.app</a></div>
  </div>
</body>
</html>
